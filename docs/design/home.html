<!doctype html>
<html lang="de" data-theme="day">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Annelies Computer — Designvorschau</title>
  <script src="home-appearance.js"></script>
  <link rel="stylesheet" href="../../src/app.css">
  <script src="home.js" type="module"></script>
</head>
<body class="aos-home-scene">
  <main class="aos-desktop aos-desktop-full" aria-label="Annelies Computer">
    <div class="aos-desktop-top">
      <div class="aos-desktop-greeting"><h1>Annelies<br>Computer</h1></div>
      <svg class="aos-clock" viewBox="0 0 200 200" role="img" aria-label="Analoge Uhr" data-clock><title>Analoge Uhr</title><circle class="aos-clock-rim" cx="100" cy="100" r="94"/><g data-clock-face></g><line class="aos-clock-hour" x1="100" y1="100" x2="100" y2="53" data-hour-hand/><line class="aos-clock-minute" x1="100" y1="100" x2="100" y2="31" data-minute-hand/><circle class="aos-clock-pin" cx="100" cy="100" r="8"/></svg>
    </div>
    <div class="aos-launchers">
      <a class="aos-launcher" aria-label="Texten" href="editor.html"><img src="../../static/design/icon-text.png" alt="" width="152" height="152"></a>
      <button class="aos-launcher" aria-label="Rechnen" type="button" data-game="Rechnen"><img src="../../static/design/icon-math.png" alt="" width="152" height="152"></button>
      <button class="aos-launcher" aria-label="Schreibspiel" type="button" data-game="Schreibspiel"><img src="../../static/design/icon-letters.png" alt="" width="152" height="152"></button>
    </div>
    <a class="aos-home-background" href="startup.html" aria-label="Hintergrund wählen"><span class="aos-icon" data-icon="sun" aria-hidden="true"></span></a>
  </main>
  <dialog class="aos-dialog" id="game-preview-dialog" aria-labelledby="game-preview-title"><h2 id="game-preview-title">Designvorschau</h2><p>Dieses Spiel ist in der Designvorschau nicht verbunden.</p><form method="dialog" class="aos-dialog-actions"><button class="aos-button" type="submit" autofocus>Zurück</button></form></dialog>
</body>
</html>
